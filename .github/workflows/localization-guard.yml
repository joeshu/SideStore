name: zh-Hans UI Guard

on:
  pull_request:
    paths:
      - "AltStore/**"
      - "scripts/ci/check_zh_hans_ui_coverage.py"
      - "scripts/ci/verify_language_switch.py"
      - ".github/workflows/localization-guard.yml"
  push:
    branches:
      - "LiveContainerSupport"
      - "fix/**"
    paths:
      - "AltStore/**"
      - "scripts/ci/check_zh_hans_ui_coverage.py"
      - "scripts/ci/verify_language_switch.py"
      - ".github/workflows/localization-guard.yml"

permissions:
  contents: read

jobs:
  zh-hans-ui-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify device-visible Simplified Chinese coverage
        run: python3 scripts/ci/check_zh_hans_ui_coverage.py

      - name: Verify real in-app language switch
        run: python3 scripts/ci/verify_language_switch.py
